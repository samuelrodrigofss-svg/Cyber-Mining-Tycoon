name: Build Android APK (Java)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Montar o projeto
        run: |
          mkdir -p src/main/java/com/cybermining/idleminer
          mkdir -p src/main/res/drawable

          cat > src/main/res/drawable/ic_launcher.xml << 'EOF2'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp"
              android:height="96dp"
              android:viewportWidth="96"
              android:viewportHeight="96">
              <path
                  android:fillColor="#1A1450"
                  android:pathData="M16,0 H80 A16,16 0 0 1 96,16 V80 A16,16 0 0 1 80,96 H16 A16,16 0 0 1 0,80 V16 A16,16 0 0 1 16,0 Z" />
              <path
                  android:fillColor="#5FE3FF"
                  android:pathData="M48,16 L67,46 L48,82 L29,46 Z" />
              <path
                  android:fillColor="#B57BFF"
                  android:pathData="M48,16 L67,46 L48,52 Z" />
              <path
                  android:fillColor="#E8742A"
                  android:pathData="M20,84 H76 V90 H20 Z" />
          </vector>
          EOF2

          cat > src/main/AndroidManifest.xml << 'EOF2'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Cyber Mining Tycoon"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-8249414808542861~8675849677" />
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF2

          DEST=src/main/java/com/cybermining/idleminer/MainActivity.java
          BEST=""
          BT=0
          for f in $(find . -iname 'MainActivity.java' -not -path './build/*'); do
            T=$(git log -1 --format=%ct -- "$f")
            echo ACHADO $f $T
            if [ "${T:-0}" -ge "$BT" ]; then
              BT=${T:-0}
              BEST=$f
            fi
          done
          if [ -z "$BEST" ]; then
            echo ERRO MainActivity.java nao existe
            exit 1
          fi
          echo USANDO $BEST
          cp "$BEST" /tmp/MA.java
          cp /tmp/MA.java "$DEST"
          ls -l src/main src/main/java/com/cybermining/idleminer

      - name: Preparar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo ERRO secret KEYSTORE_BASE64 nao foi criado
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Compilar APK assinado
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Publicar em Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cyber-mining-tycoon-apk
          path: build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publicar em Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls build/outputs/apk/release/*.apk | head -1)
          cp "$APK" cyber-mining-tycoon.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest cyber-mining-tycoon.apk --title Teste --notes Teste
